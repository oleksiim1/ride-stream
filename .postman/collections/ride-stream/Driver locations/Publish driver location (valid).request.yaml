$kind: http-request
url: "{{baseUrl}}/api/v1/driver-locations"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "driver_id": "drv_001",
      "lat": 50.4501,
      "lng": 30.5234,
      "heading": 90,
      "speed_kmh": 0,
      "accuracy_m": 8,
      "recorded_at": "{{recordedAt}}"
    }
scripts:
  - type: beforeRequest
    code: pm.variables.set('recordedAt', new Date().toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('202 Accepted', () => pm.response.to.have.status(202));
      pm.test('status is accepted', () => pm.expect(pm.response.json().status).to.eql('accepted'));
    language: text/javascript
order: 1000

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Jobs run cheapest first; each one waits for the previous to pass so failures surface fast.
jobs:
  code-style:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up PHP & Composer
        uses: ./.github/actions/setup-php

      - name: Check code style
        run: vendor/bin/pint --test

  static-analysis:
    name: Static analysis (Larastan)
    needs: code-style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up PHP & Composer
        uses: ./.github/actions/setup-php

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  security-audit:
    name: Security audit (Composer)
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # Fails on known vulnerabilities; abandoned packages are reported but do not fail the build.
      - name: Audit dependencies for known vulnerabilities
        run: composer audit --locked --abandoned=report

  tests:
    name: Tests (PHPUnit)
    needs: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Real environment variables take precedence over both .env and the
    # non-forced <env> defaults in phpunit.xml, so tests hit PostGIS, not SQLite.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up PHP & Composer
        uses: ./.github/actions/setup-php

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # template1 gets PostGIS too, so any database created from it (e.g. parallel test databases) has it.
      - name: Enable PostGIS
        env:
          PGPASSWORD: postgres
        run: |
          for db in template1 testing; do
            psql -h 127.0.0.1 -U postgres -d "$db" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          done
          psql -h 127.0.0.1 -U postgres -d testing -tAc 'SELECT postgis_full_version();'

      - name: Run migrations
        run: php artisan migrate --force --no-interaction

      - name: Run tests
        run: php artisan test
